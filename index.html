<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D сцена с текстурой кирпичей</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: #ffaa00;
            padding: 8px 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="status">🔄 Загрузка сцены...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const statusDiv = document.getElementById('status');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.target.set(0, 1, 0);

        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(3, 5, 2);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        const fillLight = new THREE.PointLight(0x8866cc, 0.4);
        fillLight.position.set(1, 2, 3);
        scene.add(fillLight);

        const textureLoader = new THREE.TextureLoader();
        
        const brickTexture = textureLoader.load('https://threejs.org/examples/textures/brick_diffuse.jpg');
        brickTexture.wrapS = THREE.RepeatWrapping;
        brickTexture.wrapT = THREE.RepeatWrapping;
        brickTexture.repeat.set(2, 2);
        
        const brickMaterial = new THREE.MeshStandardMaterial({ 
            map: brickTexture,
            roughness: 0.7,
            metalness: 0.1
        });

        const cubeGeometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
        const cube = new THREE.Mesh(cubeGeometry, brickMaterial);
        cube.position.set(-2.5, 0.6, 0);
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);
        
        const sphereGeometry = new THREE.SphereGeometry(0.7, 64, 64);
        const sphere = new THREE.Mesh(sphereGeometry, brickMaterial);
        sphere.position.set(2.5, 0.7, 1);
        sphere.castShadow = true;
        sphere.receiveShadow = true;
        scene.add(sphere);
        
        const cylinderGeometry = new THREE.CylinderGeometry(0.6, 0.6, 1.4, 48);
        const cylinder = new THREE.Mesh(cylinderGeometry, brickMaterial);
        cylinder.position.set(0, 0.3, -2.2);
        cylinder.castShadow = true;
        cylinder.receiveShadow = true;
        scene.add(cylinder);
        
        const torusGeometry = new THREE.TorusGeometry(0.85, 0.22, 64, 128);
        const torus = new THREE.Mesh(torusGeometry, brickMaterial);
        torus.position.set(-1, 1.3, 2.2);
        torus.castShadow = true;
        scene.add(torus);
        
        const coneGeometry = new THREE.ConeGeometry(0.65, 1.3, 48);
        const cone = new THREE.Mesh(coneGeometry, brickMaterial);
        cone.position.set(1.2, 0, -1);
        cone.castShadow = true;
        cone.receiveShadow = true;
        scene.add(cone);

        const planeGeometry = new THREE.PlaneGeometry(14, 14);
        const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x6699aa, roughness: 0.8, metalness: 0.1 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -0.6;
        plane.receiveShadow = true;
        scene.add(plane);
        
        const gridHelper = new THREE.GridHelper(16, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -0.5;
        scene.add(gridHelper);

        // === ЗАГРУЗКА ВАШЕЙ 3D МОДЕЛИ ===
        const loader = new GLTFLoader();
        let bankoModel = null;
        
        // Прямая RAW-ссылка на ваш файл
        const modelUrl = 'https://raw.githubusercontent.com/raffeline/3D-MODELS/main/%D0%B1%D0%B0%D0%BD%D0%BA%D0%BE.glb';
        
        statusDiv.innerHTML = '🔄 Загрузка модели банко...';
        
        loader.load(
            modelUrl,
            (gltf) => {
                bankoModel = gltf.scene;
                bankoModel.position.set(0, -0.5, 2);
                bankoModel.scale.set(1, 1, 1);
                bankoModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                scene.add(bankoModel);
                statusDiv.innerHTML = '✅ Модель банко загружена!';
                statusDiv.style.color = '#0f0';
                console.log('✅ Модель банко успешно загружена');
            },
            (xhr) => {
                const percent = Math.floor((xhr.loaded / xhr.total) * 100);
                statusDiv.innerHTML = `📦 Загрузка модели: ${percent}%`;
            },
            (error) => {
                console.error('❌ Ошибка загрузки модели:', error);
                statusDiv.innerHTML = '❌ Ошибка: модель не загружена. Проверьте консоль (F12)';
                statusDiv.style.color = '#f66';
                
                // СОЗДАЁМ ЗАМЕНУ (красный тор) - чтобы вы видели, что код работает
                const fallbackGeometry = new THREE.TorusGeometry(0.8, 0.15, 32, 64);
                const fallbackMaterial = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0x220000 });
                const fallbackModel = new THREE.Mesh(fallbackGeometry, fallbackMaterial);
                fallbackModel.position.set(0, 0.5, 2);
                fallbackModel.castShadow = true;
                scene.add(fallbackModel);
                bankoModel = fallbackModel;
            }
        );

        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.016;
            
            cube.rotation.x += 0.008;
            cube.rotation.y += 0.012;
            
            const scale = 1 + Math.sin(time * 2.5) * 0.08;
            sphere.scale.set(scale, scale, scale);
            
            cylinder.position.y = 0.3 + Math.sin(time * 2.2) * 0.2;
            cylinder.rotation.z += 0.015;
            cylinder.rotation.x += 0.01;
            
            torus.rotation.x += 0.012;
            torus.rotation.y += 0.018;
            torus.rotation.z += 0.008;
            
            cone.rotation.y += 0.01;
            cone.position.y = 0 + Math.sin(time * 2.8) * 0.15;
            
            if (bankoModel) {
                bankoModel.rotation.y += 0.005;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>

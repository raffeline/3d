<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная 3D сцена</title>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Создание сцены
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        // Создание камеры
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 10);
        camera.lookAt(0, 0, 0);

        // Создание рендерера
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Управление мышью OrbitControls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.target.set(0, 1, 0);

        // Освещение
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(2, 5, 3);
        scene.add(directionalLight);
        
        const backLight = new THREE.PointLight(0x4466cc, 0.5);
        backLight.position.set(-2, 2, -3);
        scene.add(backLight);

        // Создание нескольких 3D объектов
        
        // Куб
        const cubeGeometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
        const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0xff3366 });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.position.set(-2, 0.5, 0);
        cube.castShadow = true;
        scene.add(cube);
        
        // Сфера
        const sphereGeometry = new THREE.SphereGeometry(0.7, 32, 32);
        const sphereMaterial = new THREE.MeshStandardMaterial({ color: 0x33ccff });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.set(2, 0.7, 1);
        sphere.castShadow = true;
        scene.add(sphere);
        
        // Цилиндр
        const cylinderGeometry = new THREE.CylinderGeometry(0.6, 0.6, 1.3, 32);
        const cylinderMaterial = new THREE.MeshStandardMaterial({ color: 0x66ff66 });
        const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
        cylinder.position.set(0, 0.2, -2);
        cylinder.castShadow = true;
        scene.add(cylinder);
        
        // Тор
        const torusGeometry = new THREE.TorusGeometry(0.8, 0.2, 32, 64);
        const torusMaterial = new THREE.MeshStandardMaterial({ color: 0xffaa44 });
        const torus = new THREE.Mesh(torusGeometry, torusMaterial);
        torus.position.set(-1, 1.2, 2);
        torus.castShadow = true;
        scene.add(torus);
        
        // Пол (плоскость)
        const planeGeometry = new THREE.PlaneGeometry(12, 12);
        const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x88aaff, side: THREE.DoubleSide });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -0.5;
        plane.receiveShadow = true;
        scene.add(plane);
        
        // Сетка для визуального ориентира
        const gridHelper = new THREE.GridHelper(15, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -0.4;
        scene.add(gridHelper);

        // Анимация объектов
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.016;
            
            // Вращение куба
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.015;
            
            // Пульсация сферы
            const scale = 1 + Math.sin(time * 3) * 0.1;
            sphere.scale.set(scale, scale, scale);
            
            // Движение цилиндра вверх-вниз
            cylinder.position.y = 0.2 + Math.sin(time * 2) * 0.25;
            cylinder.rotation.z += 0.02;
            
            // Вращение тора
            torus.rotation.x += 0.01;
            torus.rotation.y += 0.02;
            
            // Обновление контролов
            controls.update();
            
            // Рендер сцены
            renderer.render(scene, camera);
        }
        
        animate();

        // Адаптация под размер окна
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>

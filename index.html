```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D сцена с текстурами</title>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.target.set(0, 1, 0);

        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(3, 5, 2);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        const fillLight = new THREE.PointLight(0x8866cc, 0.4);
        fillLight.position.set(1, 2, 3);
        scene.add(fillLight);
        
        const textureLoader = new THREE.TextureLoader();
        
        const stoneTexture = textureLoader.load('https://img.freepik.com/premium-photo/stone-texture-dark-stone-old-stone-texture_324894-81.jpg');
        stoneTexture.wrapS = THREE.RepeatWrapping;
        stoneTexture.wrapT = THREE.RepeatWrapping;
        stoneTexture.repeat.set(2, 2);
        
        const woodTexture = textureLoader.load('https://threejs.org/examples/textures/uv_grid_opengl.jpg');
        woodTexture.wrapS = THREE.RepeatWrapping;
        woodTexture.wrapT = THREE.RepeatWrapping;
        woodTexture.repeat.set(1.5, 1.5);
        
        const metalTexture = textureLoader.load('https://threejs.org/examples/textures/brick_diffuse.jpg');
        metalTexture.wrapS = THREE.RepeatWrapping;
        metalTexture.wrapT = THREE.RepeatWrapping;
        metalTexture.repeat.set(3, 3);

        const stoneMaterial = new THREE.MeshStandardMaterial({ 
            map: stoneTexture,
            color: 0xcccccc,
            roughness: 0.7,
            metalness: 0.1
        });
        
        const woodMaterial = new THREE.MeshStandardMaterial({ 
            map: woodTexture,
            color: 0xaa9977,
            roughness: 0.6,
            metalness: 0.05
        });
        
        const metalMaterial = new THREE.MeshStandardMaterial({ 
            map: metalTexture,
            color: 0x88aaff,
            roughness: 0.3,
            metalness: 0.8
        });

        const cubeGeometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
        const cube = new THREE.Mesh(cubeGeometry, stoneMaterial);
        cube.position.set(-2.5, 0.6, 0);
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);
        
        const sphereGeometry = new THREE.SphereGeometry(0.7, 64, 64);
        const sphere = new THREE.Mesh(sphereGeometry, woodMaterial);
        sphere.position.set(2.5, 0.7, 1);
        sphere.castShadow = true;
        sphere.receiveShadow = true;
        scene.add(sphere);
        
        const cylinderGeometry = new THREE.CylinderGeometry(0.6, 0.6, 1.4, 48);
        const cylinder = new THREE.Mesh(cylinderGeometry, metalMaterial);
        cylinder.position.set(0, 0.3, -2.2);
        cylinder.castShadow = true;
        cylinder.receiveShadow = true;
        scene.add(cylinder);
        
        const torusGeometry = new THREE.TorusGeometry(0.85, 0.22, 64, 128);
        const torus = new THREE.Mesh(torusGeometry, stoneMaterial);
        torus.position.set(-1, 1.3, 2.2);
        torus.castShadow = true;
        scene.add(torus);
        
        const coneGeometry = new THREE.ConeGeometry(0.65, 1.3, 48);
        const cone = new THREE.Mesh(coneGeometry, woodMaterial);
        cone.position.set(1.2, 0, -1);
        cone.castShadow = true;
        cone.receiveShadow = true;
        scene.add(cone);

        const planeGeometry = new THREE.PlaneGeometry(14, 14);
        const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x6699aa, roughness: 0.8, metalness: 0.1 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -0.6;
        plane.receiveShadow = true;
        scene.add(plane);
        
        const gridHelper = new THREE.GridHelper(16, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -0.5;
        scene.add(gridHelper);

        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.016;
            
            cube.rotation.x += 0.008;
            cube.rotation.y += 0.012;
            
            const scale = 1 + Math.sin(time * 2.5) * 0.08;
            sphere.scale.set(scale, scale, scale);
            
            cylinder.position.y = 0.3 + Math.sin(time * 2.2) * 0.2;
            cylinder.rotation.z += 0.015;
            cylinder.rotation.x += 0.01;
            
            torus.rotation.x += 0.012;
            torus.rotation.y += 0.018;
            torus.rotation.z += 0.008;
            
            cone.rotation.y += 0.01;
            cone.position.y = 0 + Math.sin(time * 2.8) * 0.15;
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
